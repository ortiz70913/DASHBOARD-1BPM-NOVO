<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard 1º BPM — Incidência por companhia</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="dash" src="index.html" title="Dashboard 1º BPM"></iframe>
<script>
const frame=document.getElementById('dash');
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
const norm=s=>clean(s).toLowerCase();
const names=['2ª CIA','1ª CIA','3ª CIA'];

function installCSS(doc){
 if(doc.getElementById('cia-bars-only-css'))return;
 const st=doc.createElement('style');st.id='cia-bars-only-css';
 st.textContent=`
 .cia-bars-only{display:flex!important;flex-direction:column!important;gap:14px!important;width:100%!important;margin:14px 0 18px!important;box-sizing:border-box!important}
 .cia-bars-only-row{display:grid!important;grid-template-columns:220px minmax(250px,1fr) 120px!important;gap:14px!important;align-items:center!important;min-height:34px!important}
 .cia-bars-only-name{font-weight:800!important;font-size:.9rem!important;color:#10233d!important;white-space:nowrap!important}
 .cia-bars-only-track{height:24px!important;background:#e8edf3!important;border:1px solid #ccd6e1!important;border-radius:7px!important;overflow:hidden!important;box-sizing:border-box!important}
 .cia-bars-only-fill{height:100%!important;border-radius:6px!important;background:linear-gradient(90deg,#8aa9cc,#123457)!important}
 .cia-bars-only-value{font-weight:900!important;font-size:.85rem!important;color:#10233d!important;text-align:right!important;white-space:nowrap!important}
 .cia-old-row-hidden{display:none!important}
 @media(max-width:700px){.cia-bars-only-row{grid-template-columns:1fr!important;gap:5px!important}.cia-bars-only-value{text-align:left!important}.cia-bars-only-track{height:21px!important}}
 `;
 doc.head.appendChild(st);
}

function findHeading(doc){
 return [...doc.querySelectorAll('h1,h2,h3,h4,.title,.hd')].find(e=>norm(e.textContent)==='incidência por companhia');
}

function findData(doc){
 const result={};
 const all=[...doc.querySelectorAll('body *')];
 for(const name of names){
   const target=norm(name);
   const candidates=all.filter(el=>{
     if(el.closest('.cia-bars-only'))return false;
     const t=clean(el.textContent);
     if(t.length>240)return false;
     if(!norm(t).includes(target))return false;
     if(!/novo registro/i.test(t))return false;
     if(!/\d+(?:[.,]\d+)?\s*%/.test(t))return false;
     return (t.match(new RegExp(target,'gi'))||[]).length===1;
   }).sort((a,b)=>a.textContent.length-b.textContent.length);
   if(!candidates.length)continue;
   const el=candidates[0];
   const t=clean(el.textContent);
   const pm=t.match(/(\d+(?:[.,]\d+)?)\s*%/);
   if(!pm)continue;
   const pct=parseFloat(pm[1].replace(',','.'));
   const before=t.slice(0,pm.index);
   const nums=before.match(/\d+/g)||[];
   const count=nums.length?parseInt(nums[nums.length-1],10):0;
   if(count>0&&pct>=0)result[name]={name,count,pct,el};
 }
 return names.map(n=>result[n]).filter(Boolean);
}

function hideOriginalRows(data){
 for(const item of data){
   let el=item.el;
   // Move upward only through the original row, never into the chart or whole panel.
   for(let i=0;i<6&&el;i++,el=el.parentElement){
     if(el.classList.contains('cia-bars-only'))break;
     const t=clean(el.textContent);
     const hasOneCIA=names.filter(n=>norm(t).includes(norm(n))).length===1;
     if(hasOneCIA && /novo registro/i.test(t) && /\d+(?:[.,]\d+)?\s*%/.test(t) && t.length<260){
       el.classList.add('cia-old-row-hidden');
       break;
     }
   }
 }
 // Also hide the common dashboard row class if present, but never anything inside our chart.
 document.querySelectorAll('.cia-old-row-hidden').forEach(()=>{});
}

function build(doc){
 if(!doc||!doc.body)return;
 installCSS(doc);
 const heading=findHeading(doc);
 if(!heading)return;
 const old=doc.querySelector('.cia-bars-only');
 if(old){hideOriginalRows(findData(doc));return;}
 const data=findData(doc);
 if(data.length!==3)return;
 const max=Math.max(...data.map(x=>x.count));
 const chart=doc.createElement('div');
 chart.className='cia-bars-only';
 chart.innerHTML=data.map(x=>{
   const width=Math.max(2,(x.count/max)*100);
   return `<div class="cia-bars-only-row"><div class="cia-bars-only-name">${x.name}</div><div class="cia-bars-only-track"><div class="cia-bars-only-fill" style="width:${width}%"></div></div><div class="cia-bars-only-value">${x.count} · ${x.pct.toFixed(1).replace('.',',')}%</div></div>`;
 }).join('');
 heading.insertAdjacentElement('afterend',chart);
 hideOriginalRows(data);
 setTimeout(()=>hideOriginalRows(data),100);
 setTimeout(()=>hideOriginalRows(data),500);
}

frame.addEventListener('load',()=>{
 const run=()=>{try{build(frame.contentDocument)}catch(e){}};
 run();setTimeout(run,500);setTimeout(run,1200);setTimeout(run,2500);
 try{
  const d=frame.contentDocument;
  const mo=new MutationObserver(()=>{clearTimeout(window.__ciaBars);window.__ciaBars=setTimeout(run,200)});
  mo.observe(d.body,{childList:true,subtree:true});
 }catch(e){}
});
</script>
</body>
</html>
