name: Fix Relatorio v7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao
        run: python3 .github/patches/fix-report-v7.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Corrige acesso autenticado aos dados do Relatorio' && git push)
