name: Corrigir perfil e login do Dashboard

on:
  push:
    paths:
      - '.github/workflows/corrigir-perfil-login.yml'
      - 'login-fix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar dashboard funcional e configurar Supabase
        shell: bash
        run: |
          git show c6fa98644289dcfbcbce200f235e252c826c1bc0:index.html > index.html

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Configura o projeto Supabase diretamente no código do dashboard.
          s=re.sub(r"const SUPABASE_URL=window\.SUPABASE_URL\|\|'[^']*';", "const SUPABASE_URL=window.SUPABASE_URL||'https://rbpuatcdlbfqxfkbvgst.supabase.co';", s, count=1)
          s=re.sub(r"const SUPABASE_ANON_KEY=window\.SUPABASE_ANON_KEY\|\|'[^']*';", "const SUPABASE_ANON_KEY=window.SUPABASE_ANON_KEY||'sb_publishable_AH0rCyKZ4J5SMfMwof3TkA_wkTXeg9D';", s, count=1)

          # Se a versão restaurada usar placeholders, substitui-os também.
          s=s.replace("'COLE_A_URL_DO_SEU_PROJETO_SUPABASE_AQUI'", "'https://rbpuatcdlbfqxfkbvgst.supabase.co'")
          s=s.replace("'COLE_A_CHAVE_ANON_PUBLICA_AQUI'", "'sb_publishable_AH0rCyKZ4J5SMfMwof3TkA_wkTXeg9D'")

          # Corrige eventual quebra de linha inválida no texto de cadastro.
          s=s.replace("err.textContent='Cadastro criado com sucesso.\nVerifique seu e-mail para confirmar a conta e depois faça login.';", "err.textContent='Cadastro criado com sucesso.\\nVerifique seu e-mail para confirmar a conta e depois faça login.';")

          p.write_text(s,encoding='utf-8')
          print('Dashboard restaurado e Supabase configurado')
          PY

      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restaurar dashboard e configurar Supabase'
          git push
