name: Inject Intelligence Report
on:
  push:
    branches: [main]
    paths:
      - 'relatorio-inteligencia.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject report script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="relatorio-inteligencia.js"></script>'
          if tag not in s:
              pos=s.lower().rfind('</body>')
              if pos<0: raise SystemExit('Tag </body> não encontrada')
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Ativa relatorio de inteligencia externo'
          git push