name: Fix Relatorio de Inteligencia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          if grep -q 'RELATORIO_INTELIGENCIA_PATCH_V2' index.html; then exit 0; fi
          base64 -d .github/patches/relatorio.py.b64 > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Corrige Relatorio de Inteligencia' && git push)
