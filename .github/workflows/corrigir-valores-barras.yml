name: Corrigir sobreposicao dos valores nas barras

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correcoes visuais e do login
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Correcao do erro de perfil no login: alguns elementos opcionais
          # nao existem no layout atual, portanto nunca podem receber .style
          # diretamente quando forem null.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_show = "function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('appShell').style.display='block';document.getElementById('userEmail').textContent=session?.user?.email||'';document.getElementById('userRole').textContent=ROLE_NAMES[role]||role;document.getElementById('up').style.display=['admin','operador'].includes(role)?'':'none';}"
          new_show = """function showApp(){
            const loginScreen=document.getElementById('loginScreen');
            const appShell=document.getElementById('appShell');
            if(loginScreen)loginScreen.style.display='none';
            if(appShell)appShell.style.display='block';
            const userEmail=document.getElementById('userEmail');
            const userRole=document.getElementById('userRole');
            const up=document.getElementById('up');
            if(userEmail)userEmail.textContent=session?.user?.email||'';
            if(userRole)userRole.textContent=ROLE_NAMES[role]||role;
            if(up)up.style.display=['admin','operador'].includes(role)?'':'none';
          }"""
          if old_show in s:
              s = s.replace(old_show, new_show, 1)
              print('showApp corrigido.')
          else:
              print('showApp ja corrigido ou trecho nao encontrado.')

          # Grafico de barras dedicado para ROUBO A PEDESTRE.
          # Reforca a faixa, altura, espacamento e preserva a largura
          # percentual calculada pelo dashboard em cada barra.
          marker = 'pedestre-bars-v1'
          if marker not in s:
              pedestre_css = r'''
<style id="pedestre-bars-v1">
#p-arma .hb,#p-local .hb,#p-abord .hb{
  display:grid!important;
  grid-template-columns:minmax(150px,240px) minmax(180px,1fr) 118px!important;
  align-items:center!important;
  gap:12px!important;
  width:100%!important;
  min-height:40px!important;
  margin:8px 0!important;
  padding:0!important;
}
#p-arma .hb>span,#p-local .hb>span,#p-abord .hb>span{
  min-width:0!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important;
  font-weight:800!important;
  line-height:1.2!important;
}
#p-arma .hb>div,#p-local .hb>div,#p-abord .hb>div{
  display:block!important;
  position:relative!important;
  width:100%!important;
  height:25px!important;
  margin:0!important;
  padding:0!important;
  background:var(--line,#dfe5ec)!important;
  border:1px solid rgba(15,28,46,.12)!important;
  border-radius:7px!important;
  overflow:hidden!important;
}
#p-arma .hb>div>i,#p-local .hb>div>i,#p-abord .hb>div>i{
  display:block!important;
  height:100%!important;
  min-width:3px!important;
  max-width:100%!important;
  margin:0!important;
  padding:0!important;
  background:linear-gradient(90deg,var(--acc,#8aa9cc),var(--hi,#0b2545))!important;
  border-radius:6px!important;
  transition:width .25s ease!important;
}
#p-arma .hb.top>div>i,#p-local .hb.top>div>i,#p-abord .hb.top>div>i{
  background:linear-gradient(90deg,#5d86b0,#0b2545)!important;
}
#p-arma .hb>b,#p-local .hb>b,#p-abord .hb>b{
  width:118px!important;
  margin:0!important;
  padding:0!important;
  text-align:left!important;
  white-space:nowrap!important;
  overflow:visible!important;
  font-weight:900!important;
  font-size:.82rem!important;
}
#p-arma .hb>b>u,#p-local .hb>b>u,#p-abord .hb>b>u{
  text-decoration:none!important;
  color:var(--mut,#5b6b7f)!important;
  font-size:.75rem!important;
  font-weight:600!important;
}
@media(max-width:900px){
  #p-arma .hb,#p-local .hb,#p-abord .hb{grid-template-columns:minmax(110px,180px) minmax(130px,1fr) 100px!important;gap:8px!important}
  #p-arma .hb>b,#p-local .hb>b,#p-abord .hb>b{width:100px!important;font-size:.74rem!important}
}
@media(max-width:600px){
  #p-arma .hb,#p-local .hb,#p-abord .hb{grid-template-columns:minmax(88px,125px) minmax(80px,1fr) 86px!important;gap:6px!important;min-height:34px!important}
  #p-arma .hb>div,#p-local .hb>div,#p-abord .hb>div{height:21px!important}
  #p-arma .hb>b,#p-local .hb>b,#p-abord .hb>b{width:86px!important;font-size:.64rem!important}
  #p-arma .hb>b>u,#p-local .hb>b>u,#p-abord .hb>b>u{font-size:.58rem!important}
}
</style>
'''
              s = s.replace('</head>', pedestre_css + '\n</head>', 1)
              print('Grafico de barras de Roubo a Pedestre ajustado.')

          p.write_text(s, encoding='utf-8')

          # Correcao visual existente das barras.
          p = Path('supabase-config.js')
          s = p.read_text(encoding='utf-8')
          marker = 'dashboard-chart-value-outside-v1'
          if marker not in s:
              s += r'''

/* dashboard-chart-value-outside-v1 */
(function(){
  const style=document.createElement('style');
  style.id='dashboard-chart-value-outside-v1';
  style.textContent=`
    #p-motiv .bars .bar>div,
    #p-bairro .bars .bar>div{
      width:calc(100% - 64px)!important;
      margin-right:64px!important;
      overflow:visible!important;
    }
    #p-motiv .bars .bar>div>em,
    #p-bairro .bars .bar>div>em{
      right:-61px!important;
      top:50%!important;
      color:var(--ink)!important;
      background:transparent!important;
      z-index:3!important;
    }
    @media(max-width:600px){
      #p-motiv .bars .bar>div,
      #p-bairro .bars .bar>div{
        width:calc(100% - 58px)!important;
        margin-right:58px!important;
      }
      #p-motiv .bars .bar>div>em,
      #p-bairro .bars .bar>div>em{right:-55px!important}
    }
  `;
  document.head.appendChild(style);
})();
'''
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar correcao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase-config.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git commit -m "Ajustar graficos de barras do Roubo a Pedestre [skip ci]"
          git push
