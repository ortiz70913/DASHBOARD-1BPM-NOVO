name: Corrigir quebra de linha do login
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir string JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "err.textContent='Cadastro criado com sucesso.\nVerifique seu e-mail para confirmar a conta e depois faça login.';"
          new = "err.textContent='Cadastro criado com sucesso.\\nVerifique seu e-mail para confirmar a conta e depois faça login.';"
          if old not in s:
              raise SystemExit('String com quebra de linha não encontrada')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Publicar correção
        uses: EndBug/add-and-commit@v9
        with:
          add: index.html
          message: "Corrigir quebra de linha no JavaScript do login"
