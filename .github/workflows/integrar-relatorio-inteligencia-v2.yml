name: Integrar Relatorio de Inteligencia v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrar:
    if: ${{ !contains(github.event.head_commit.message, '[skip relatorio]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Integrar script no index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="relatorio-inteligencia-v2.js"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>', tag+'\n</body>',1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integra Relatorio de Inteligencia v2 [skip relatorio]'
          git push
