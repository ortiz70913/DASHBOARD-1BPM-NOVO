name: Corrigir definitivamente proporcao dos graficos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-bars-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste direto no index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
/* AJUSTE-DIRETO-GRAFICOS-V2 */
.bars{width:100%!important;max-width:100%!important}
.bars .bar{grid-template-columns:fit-content(220px) minmax(0,1fr)!important;gap:5px!important;width:100%!important;min-width:0!important}
.bars .bar>b{width:auto!important;max-width:220px!important;min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
.bars .bar>div{min-width:0!important;width:100%!important}
.bars .bar .bardelta{grid-column:2!important}
@media(max-width:700px){
  .bars .bar{grid-template-columns:1fr!important;gap:4px!important}
  .bars .bar .bardelta{grid-column:1!important}
}
'''
          marker = '/* AJUSTE-DIRETO-GRAFICOS-V2 */'
          if marker not in s:
              pos = s.rfind('</style>')
              if pos < 0:
                  raise SystemExit('Tag </style> nao localizada')
              s = s[:pos] + css + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
          else:
              print('Ajuste ja existente')
          PY
      - name: Commitar index.html corrigido
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && echo 'Sem alterações' && exit 0
          git commit -m 'Corrigir espaco entre nomes e barras dos graficos'
          git push
