name: Corrigir barras Roubo a Pedestre

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar barras visiveis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* pedestre-bars-v1 */'
          if marker not in s:
              patch=r'''\n<style id="pedestre-bars-v1">\n/* pedestre-bars-v1 */\n#p-arma .hb,#p-local .hb,#p-abord .hb{\n  display:grid!important;\n  grid-template-columns:minmax(125px,180px) minmax(180px,1fr) 105px!important;\n  gap:10px!important;\n  align-items:center!important;\n  width:100%!important;\n  min-height:36px!important;\n  margin:8px 0!important;\n  box-sizing:border-box!important;\n}\n#p-arma .hb>span,#p-local .hb>span,#p-abord .hb>span{\n  display:block!important;\n  min-width:0!important;\n  overflow:hidden!important;\n  text-overflow:ellipsis!important;\n  white-space:nowrap!important;\n  font-weight:800!important;\n}\n#p-arma .hb>div,#p-local .hb>div,#p-abord .hb>div{\n  display:block!important;\n  position:relative!important;\n  width:100%!important;\n  height:24px!important;\n  min-height:24px!important;\n  margin:0!important;\n  padding:0!important;\n  background:#e7edf4!important;\n  border:1px solid #cbd6e2!important;\n  border-radius:7px!important;\n  overflow:hidden!important;\n  box-sizing:border-box!important;\n}\n#p-arma .hb>div>i,#p-local .hb>div>i,#p-abord .hb>div>i{\n  display:block!important;\n  height:100%!important;\n  min-height:100%!important;\n  min-width:3px!important;\n  max-width:100%!important;\n  margin:0!important;\n  padding:0!important;\n  background:linear-gradient(90deg,#5f87b1,#163b63)!important;\n  border-radius:6px!important;\n  box-sizing:border-box!important;\n}\n#p-arma .hb.top>div>i,#p-local .hb.top>div>i,#p-abord .hb.top>div>i{\n  background:linear-gradient(90deg,#2f6397,#0b2d50)!important;\n}\n#p-arma .hb>b,#p-local .hb>b,#p-abord .hb>b{\n  display:block!important;\n  width:105px!important;\n  margin:0!important;\n  padding:0!important;\n  text-align:left!important;\n  white-space:nowrap!important;\n  overflow:visible!important;\n  font-weight:900!important;\n}\n#p-arma .hb>b>u,#p-local .hb>b>u,#p-abord .hb>b>u{\n  text-decoration:none!important;\n  font-weight:600!important;\n}\n@media(max-width:700px){\n #p-arma .hb,#p-local .hb,#p-abord .hb{grid-template-columns:minmax(100px,145px) minmax(90px,1fr) 88px!important;gap:7px!important}\n #p-arma .hb>b,#p-local .hb>b,#p-abord .hb>b{width:88px!important;font-size:.75rem!important}\n}\n@media(max-width:480px){\n #p-arma .hb,#p-local .hb,#p-abord .hb{grid-template-columns:1fr!important;gap:4px!important}\n #p-arma .hb>div,#p-local .hb>div,#p-abord .hb>div{width:100%!important}\n #p-arma .hb>b,#p-local .hb>b,#p-abord .hb>b{width:auto!important}\n}\n</style>\n'''
              s=s.replace('</head>',patch+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commitar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar graficos de barras no Roubo a Pedestre [skip ci]"
          git push
