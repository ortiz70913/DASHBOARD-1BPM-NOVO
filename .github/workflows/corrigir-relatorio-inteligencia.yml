name: Corrigir Relatorio de Inteligencia
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  corrigir:
    if: ${{ !contains(github.event.head_commit.message, '[skip relatorio]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover conflito do relatorio v2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="relatorio-inteligencia-v2.js"></script>\n','')
          s=s.replace('<script src="relatorio-inteligencia-v2.js"></script>','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Garantir script confiavel do relatorio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="relatorio-inteligencia.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove conflito do Relatorio de Inteligencia [skip relatorio]'
          git push
