<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard 1º BPM — Roubo a Estabelecimento</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="dash" src="index.html" title="Dashboard 1º BPM"></iframe><script>
const css=`
/* GRAFICOS DE BARRAS — ROUBO A ESTABELECIMENTO — v2 */
.roubo-bar-chart{display:flex!important;flex-direction:column!important;gap:14px!important;width:100%!important;margin:12px 0 6px!important;padding:4px 0!important}
.roubo-bar-row{display:grid!important;grid-template-columns:190px minmax(0,1fr) 110px!important;gap:12px!important;align-items:center!important;width:100%!important;min-height:38px!important}
.roubo-bar-name{font-size:.86rem!important;font-weight:800!important;color:var(--ink,#0f1c2e)!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
.roubo-bar-track{height:25px!important;width:100%!important;background:#e9eef4!important;border:1px solid #d4dce6!important;border-radius:8px!important;overflow:hidden!important;box-sizing:border-box!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)!important}
.roubo-bar-fill{height:100%!important;min-width:0!important;border-radius:7px!important;background:linear-gradient(90deg,var(--acc,#3867a8),var(--hi,#0b2545))!important;transition:width .35s ease!important}
.roubo-bar-value{font-size:.78rem!important;font-weight:900!important;color:var(--ink,#0f1c2e)!important;text-align:right!important;white-space:nowrap!important}
@media(max-width:800px){.roubo-bar-row{grid-template-columns:145px minmax(0,1fr) 90px!important;gap:8px!important}.roubo-bar-track{height:23px!important}}
@media(max-width:550px){.roubo-bar-row{grid-template-columns:1fr!important;gap:3px!important}.roubo-bar-name{font-size:.78rem!important}.roubo-bar-value{text-align:left!important;font-size:.72rem!important}.roubo-bar-track{height:21px!important}}
`;
function countFrom(t){
  const s=String(t||'').replace(/\u00a0/g,' ');
  const beforePct=s.split('%')[0];
  const nums=[...beforePct.matchAll(/\d+(?:[.,]\d+)?/g)].map(m=>parseFloat(m[0].replace(',','.')));
  return nums.length>=2?nums[1]:(nums[0]||0);
}
function percentFrom(t){const m=String(t||'').match(/(\d+(?:[.,]\d+)?)\s*%/);return m?parseFloat(m[1].replace(',','.')):0}
function heading(panel){return panel.querySelector(':scope > h1,:scope > h2,:scope > h3,:scope > h4,:scope > .title,:scope > .hd')}
function findPanels(d){
  const out=[];
  d.querySelectorAll('.bars').forEach(source=>{
    let p=source.parentElement;
    for(let i=0;i<6&&p;i++,p=p.parentElement){
      const h=heading(p);
      if(h){
        const t=h.textContent.trim().toLowerCase();
        if(t.includes('arma utilizada')||t.includes('local do fato')||t.includes('meio utilizado')||t.includes('modo de abordagem')){out.push({panel:p,source});break}
      }
    }
  });
  return out;
}
function buildPanel(d,item){
  const {panel,source}=item;
  if(panel.dataset.rouboGrafico==='v2')return;
  const rows=[...source.querySelectorAll(':scope > .bar')];
  if(!rows.length)return;
  const chart=d.createElement('div');chart.className='roubo-bar-chart';chart.dataset.rouboChart='v2';
  const data=rows.map(r=>{
    const name=r.querySelector(':scope > b')?.textContent.trim()||'';
    const raw=r.textContent||'';
    return{name,count:countFrom(raw),pct:percentFrom(raw)};
  }).filter(x=>x.name);
  const max=Math.max(1,...data.map(x=>x.count));
  chart.innerHTML=data.map(x=>{const w=x.count?Math.max(2,(x.count/max)*100):0;return `<div class="roubo-bar-row"><div class="roubo-bar-name" title="${x.name.replace(/"/g,'&quot;')}">${x.name}</div><div class="roubo-bar-track"><div class="roubo-bar-fill" style="width:${w}%"></div></div><div class="roubo-bar-value">${x.count} · ${x.pct.toFixed(1).replace('.',',')}%</div></div>`}).join('');
  source.style.display='none';source.parentNode.insertBefore(chart,source);panel.dataset.rouboGrafico='v2';
}
function fix(){const f=document.getElementById('dash');try{const d=f.contentDocument;if(!d||!d.body)return;if(!d.getElementById('roubo-bars-css')){const st=d.createElement('style');st.id='roubo-bars-css';st.textContent=css;d.head.appendChild(st)}findPanels(d).forEach(item=>buildPanel(d,item))}catch(e){}}
document.getElementById('dash').addEventListener('load',()=>{fix();setTimeout(fix,500);setTimeout(fix,1200);setTimeout(fix,2500);setTimeout(fix,5000)});setInterval(fix,2000);
</script></body></html>
