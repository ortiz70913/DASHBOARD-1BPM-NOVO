<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard 1º BPM — Roubo a Estabelecimento Comercial</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="dash" src="./index.html" title="Dashboard 1º BPM"></iframe>
<script>
/*
  O index.html já cria os gráficos com .hb.
  Este arquivo NÃO duplica os dados: apenas transforma os .hb em barras visíveis.
*/
const CSS=`
#p-cia{display:none!important}

.hb{
 display:grid!important;
 grid-template-columns:minmax(170px,260px) minmax(220px,1fr) 125px!important;
 align-items:center!important;
 column-gap:12px!important;
 width:100%!important;
 min-height:36px!important;
 margin:7px 0!important;
 padding:0!important;
 box-sizing:border-box!important;
 overflow:visible!important;
}
.hb>span{
 grid-column:1!important;grid-row:1!important;
 display:block!important;min-width:0!important;
 color:var(--ink,#10233d)!important;
 font-weight:800!important;font-size:.86rem!important;
 line-height:1.2!important;white-space:nowrap!important;
 overflow:hidden!important;text-overflow:ellipsis!important;
}
.hb>div{
 grid-column:2!important;grid-row:1!important;
 display:block!important;position:relative!important;
 width:100%!important;height:23px!important;
 margin:0!important;padding:0!important;
 background:#e8edf3!important;
 border:1px solid #cbd6e2!important;
 border-radius:7px!important;overflow:hidden!important;
 box-sizing:border-box!important;
}
.hb>div>i{
 display:block!important;
 height:100%!important;
 margin:0!important;padding:0!important;
 min-width:2px!important;max-width:100%!important;
 background:linear-gradient(90deg,#8aa9cc,#123457)!important;
 border-radius:6px!important;
 box-sizing:border-box!important;
}
.hb.top>div>i{background:linear-gradient(90deg,#5d86b0,#0b2545)!important}
.hb>b{
 grid-column:3!important;grid-row:1!important;
 display:block!important;width:125px!important;
 margin:0!important;padding:0!important;
 color:var(--ink,#10233d)!important;
 font-size:.82rem!important;font-weight:900!important;
 line-height:1.2!important;text-align:left!important;
 white-space:nowrap!important;overflow:visible!important;
}
.hb>b>u{
 text-decoration:none!important;
 color:var(--mut,#5b6b7f)!important;
 font-weight:600!important;font-size:.76rem!important;
}

#p-estab .hb,#p-tipoc .hb,#p-logr .hb,
#p-arma .hb,#p-local .hb,#p-abord .hb{
 min-height:38px!important;margin:8px 0!important;
}
#p-estab .hb>div,#p-tipoc .hb>div,#p-logr .hb>div,
#p-arma .hb>div,#p-local .hb>div,#p-abord .hb>div{
 height:24px!important;
}

@media(max-width:900px){
 .hb{grid-template-columns:minmax(125px,200px) minmax(140px,1fr) 105px!important;column-gap:8px!important}
 .hb>span{font-size:.78rem!important}
 .hb>b{width:105px!important;font-size:.74rem!important}
 .hb>b>u{font-size:.68rem!important}
}
@media(max-width:600px){
 .hb{grid-template-columns:minmax(95px,140px) minmax(80px,1fr) 88px!important;column-gap:6px!important}
 .hb>span{font-size:.68rem!important}
 .hb>b{width:88px!important;font-size:.64rem!important}
 .hb>b>u{font-size:.58rem!important}
}
`;

function corrigir(doc){
 if(!doc||!doc.body)return;
 let st=doc.getElementById('roubo-graficos-final');
 if(!st){st=doc.createElement('style');st.id='roubo-graficos-final';doc.head.appendChild(st)}
 st.textContent=CSS;
 const cia=doc.querySelector('#p-cia');
 if(cia)cia.remove();
 doc.querySelectorAll('.hb').forEach(row=>{
   const track=row.querySelector(':scope > div');
   const fill=track&&track.querySelector(':scope > i');
   if(!track||!fill)return;
   track.style.display='block';
   track.style.position='relative';
   track.style.overflow='hidden';
   fill.style.display='block';
   fill.style.height='100%';
 });
}

const frame=document.getElementById('dash');
let observer=null,timer=null;
function executar(){
 try{
   const doc=frame.contentDocument;
   if(!doc)return;
   corrigir(doc);
   if(!observer&&doc.body){
     observer=new MutationObserver(()=>{
       clearTimeout(timer);
       timer=setTimeout(()=>corrigir(doc),80);
     });
     observer.observe(doc.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['style','class']});
   }
 }catch(e){console.error(e)}
}
frame.addEventListener('load',()=>{
 executar();
 [100,300,700,1200,2000,3500,5000,8000].forEach(ms=>setTimeout(executar,ms));
});
setTimeout(executar,500);
</script>
</body>
</html>
