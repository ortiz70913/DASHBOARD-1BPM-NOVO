<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard 1º BPM — Gráficos</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="dash" src="index.html" title="Dashboard 1º BPM"></iframe>
<script>
/*
  CORREÇÃO DEFINITIVA:
  Não cria um segundo gráfico e não tenta copiar os dados para outro elemento.
  O código transforma diretamente cada .bar que já existe no index.html em uma
  barra horizontal. Assim os valores continuam vindo da mesma fonte de dados.
*/
const styleText=`
/* esconder somente Incidência por CIA */
#p-cia{display:none!important}

/* container dos dados */
.bars{
  display:flex!important;
  flex-direction:column!important;
  gap:10px!important;
  width:100%!important;
  margin:0!important;
  padding:0!important;
}

/* cada registro vira uma linha de gráfico */
.bars .bar{
  display:grid!important;
  grid-template-columns:minmax(170px,240px) minmax(220px,1fr) 115px!important;
  grid-template-rows:30px!important;
  column-gap:12px!important;
  align-items:center!important;
  width:100%!important;
  min-height:30px!important;
  margin:0!important;
  padding:0!important;
  overflow:visible!important;
  box-sizing:border-box!important;
}

/* nome */
.bars .bar>b{
  grid-column:1!important;
  grid-row:1!important;
  display:block!important;
  min-width:0!important;
  margin:0!important;
  padding:0!important;
  text-align:left!important;
  font-size:.86rem!important;
  font-weight:800!important;
  color:var(--ink,#10233d)!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}

.bars .bar>b .ranknum{
  display:inline-block!important;
  width:28px!important;
  min-width:28px!important;
  color:var(--mut,#5b6b7f)!important;
  font-weight:700!important;
}

/* trilho da barra */
.bars .bar>div{
  grid-column:2!important;
  grid-row:1!important;
  position:relative!important;
  display:block!important;
  width:100%!important;
  height:22px!important;
  min-height:22px!important;
  margin:0!important;
  padding:0!important;
  background:#e8edf3!important;
  border:1px solid #ccd6e1!important;
  border-radius:7px!important;
  overflow:visible!important;
  box-sizing:border-box!important;
}

/* preenchimento proporcional já calculado pelo dashboard */
.bars .bar>div>i{
  display:block!important;
  height:100%!important;
  min-width:0!important;
  max-width:100%!important;
  margin:0!important;
  padding:0!important;
  background:linear-gradient(90deg,#8aa9cc,#123457)!important;
  border-radius:6px!important;
  box-sizing:border-box!important;
  transition:width .25s ease!important;
}

/* valor fica sempre fora da barra, sem ser coberto */
.bars .bar>div>em{
  position:absolute!important;
  left:calc(100% + 10px)!important;
  top:50%!important;
  transform:translateY(-50%)!important;
  width:105px!important;
  margin:0!important;
  padding:0!important;
  background:transparent!important;
  color:var(--ink,#10233d)!important;
  font-size:.80rem!important;
  font-weight:900!important;
  font-style:italic!important;
  text-align:left!important;
  white-space:nowrap!important;
  overflow:visible!important;
  z-index:20!important;
}

/* retirar a mensagem de variação de cada linha para deixar somente os dados com barras */
.bars .bar .bardelta{display:none!important}

/* ORCRIM também usa o mesmo .bars */
#p-orcrim-vitima .bars,
#p-orcrim-autores .bars{display:flex!important}

@media(max-width:900px){
  .bars .bar{grid-template-columns:minmax(130px,190px) minmax(150px,1fr) 105px!important;column-gap:8px!important}
  .bars .bar>b{font-size:.78rem!important}
  .bars .bar>div>em{font-size:.72rem!important;left:calc(100% + 7px)!important}
}

@media(max-width:600px){
  .bars .bar{grid-template-columns:1fr!important;grid-template-rows:auto 20px auto!important;row-gap:3px!important;min-height:54px!important}
  .bars .bar>b{grid-column:1!important;grid-row:1!important}
  .bars .bar>div{grid-column:1!important;grid-row:2!important;width:calc(100% - 82px)!important}
  .bars .bar>div>em{left:calc(100% + 7px)!important;width:75px!important;font-size:.68rem!important}
}
`;

function inject(d){
  if(!d||!d.head)return;
  let st=d.getElementById('graficos-fix-final');
  if(!st){st=d.createElement('style');st.id='graficos-fix-final';d.head.appendChild(st)}
  st.textContent=styleText;
}

function removeCIA(d){
  const p=d&&d.querySelector('#p-cia');
  if(p)p.remove();
}

function fixBars(d){
  if(!d||!d.body)return;
  inject(d);
  removeCIA(d);

  /*
     O index.html já gera os registros em .bars .bar.
     Aqui apenas garantimos que cada linha tenha os elementos esperados.
     Não duplicamos nenhum dado e não criamos uma segunda lista.
  */
  d.querySelectorAll('.bars .bar').forEach(row=>{
    const track=row.querySelector(':scope > div');
    const fill=track&&track.querySelector(':scope > i');
    const value=track&&track.querySelector(':scope > em');
    if(!track||!fill||!value)return;

    track.style.display='block';
    track.style.position='relative';
    track.style.overflow='visible';
    fill.style.display='block';
    fill.style.maxWidth='100%';
    value.style.display='block';
  });
}

const frame=document.getElementById('dash');
let timer=null;
function run(){
  try{
    const d=frame.contentDocument;
    if(!d)return;
    fixBars(d);
  }catch(e){console.error('GRÁFICOS:',e)}
}

frame.addEventListener('load',()=>{
  run();
  [250,700,1400,2500,5000,8000].forEach(ms=>setTimeout(run,ms));
  try{
    const d=frame.contentDocument;
    if(d&&d.body){
      new MutationObserver(()=>{
        clearTimeout(timer);
        timer=setTimeout(run,120);
      }).observe(d.body,{childList:true,subtree:true,characterData:true});
    }
  }catch(e){console.error('OBSERVER:',e)}
});

/* caso o iframe já esteja carregado */
setTimeout(run,300);
</script>
</body>
</html>
