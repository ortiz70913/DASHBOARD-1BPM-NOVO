<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard 1º BPM — Gráficos</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="dash" src="index.html" title="Dashboard 1º BPM"></iframe>
<script>
const css=`
.roubo-bar-chart,.big-chart{display:flex!important;flex-direction:column!important;gap:12px!important;width:100%!important;margin:16px 0!important;padding:0!important}
.roubo-bar-row,.big-chart-row{display:grid!important;grid-template-columns:220px minmax(220px,1fr) 115px!important;gap:12px!important;align-items:center!important;width:100%!important;min-height:38px!important}
.roubo-bar-name,.big-chart-name{font-size:.88rem!important;font-weight:800!important;color:#10233d!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.roubo-bar-track,.big-chart-track{height:24px!important;width:100%!important;background:#e8edf3!important;border:1px solid #ccd6e1!important;border-radius:7px!important;overflow:hidden!important;box-sizing:border-box!important}
.roubo-bar-fill,.big-chart-fill{height:100%!important;min-width:2px!important;border-radius:6px!important;background:linear-gradient(90deg,#8aa9cc,#123457)!important}
.roubo-bar-value,.big-chart-value{font-size:.84rem!important;font-weight:900!important;color:#10233d!important;text-align:right!important;white-space:nowrap!important}
.roubo-source-hidden{display:none!important}
@media(max-width:900px){.roubo-bar-row,.big-chart-row{grid-template-columns:170px minmax(140px,1fr) 100px!important;gap:8px!important}}
@media(max-width:600px){.roubo-bar-row,.big-chart-row{grid-template-columns:1fr!important;gap:4px!important}.roubo-bar-value,.big-chart-value{text-align:left!important}.roubo-bar-track,.big-chart-track{height:21px!important}}
`;
function norm(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase()}
function pct(t){const m=String(t||'').match(/(\d+(?:[.,]\d+)?)\s*%/);return m?parseFloat(m[1].replace(',','.')):0}
function count(t){const s=String(t||'').replace(/\s+/g,' ').trim();const pm=s.match(/\d+(?:[.,]\d+)?\s*%/);const before=pm?s.slice(0,pm.index):s;const nums=before.match(/\d+/g)||[];return nums.length?parseInt(nums[nums.length-1],10)||0:0}
function titleNode(d,title){const wanted=norm(title);return [...d.querySelectorAll('h1,h2,h3,h4,h5,.title,.hd,[class*="title"],[class*="heading"]')].find(e=>{const t=norm(e.textContent);return t===wanted||t.includes(wanted)})||null}
function makeChart(d,key,data,target){if(!data.length||d.querySelector('[data-chart-key="'+key+'"]'))return false;const max=Math.max(1,...data.map(x=>x.count));const c=d.createElement('div');c.className='roubo-bar-chart';c.dataset.chartKey=key;c.innerHTML=data.map(x=>'<div class="roubo-bar-row"><div class="roubo-bar-name">'+x.name+'</div><div class="roubo-bar-track"><div class="roubo-bar-fill" style="width:'+Math.max(2,x.count/max*100)+'%"></div></div><div class="roubo-bar-value">'+x.count+' · '+x.pct.toFixed(1).replace('.',',')+'%</div></div>').join('');target.parentNode.insertBefore(c,target.nextSibling);return true}
function robberyChart(d,title,anchor,key){if(d.querySelector('[data-chart-key="'+key+'"]))return true;const h=titleNode(d,title);if(!h)return false;let panel=h.parentElement,source=null;for(let i=0;i<14&&panel;i++,panel=panel.parentElement){const candidates=[...panel.querySelectorAll('.bars')];source=candidates.find(s=>norm(s.textContent).includes(norm(anchor))&&s.querySelectorAll('.bar').length>=2);if(source)break}if(!source)return false;const rows=[...source.querySelectorAll('.bar')];const data=rows.map(r=>{const b=r.querySelector('b,strong');let name=b?b.textContent.trim():r.textContent.replace(/\d+(?:[.,]\d+)?\s*%.*$/,'').trim();name=name.replace(/^\s*\d+\s*[º°.]?\s*/,'').trim();return{name,count:count(r.textContent),pct:pct(r.textContent)}}).filter(x=>x.name&&x.count>0);if(!makeChart(d,key,data,h))return false;source.classList.add('roubo-source-hidden');return true}
function orcrim(d,id,key){if(d.querySelector('[data-chart-key="'+key+'"]))return true;const s=d.querySelector(id);if(!s)return false;const src=s.querySelector('.bars');if(!src)return false;const rows=[...src.querySelectorAll('.bar')];if(!rows.length)return false;const data=rows.map(r=>{const b=r.querySelector('b,strong');return{name:b?b.textContent.trim():r.textContent,count:count(r.textContent),pct:pct(r.textContent)}}).filter(x=>x.name&&x.count>0);if(!data.length)return false;const max=Math.max(1,...data.map(x=>x.count));const c=d.createElement('div');c.className='big-chart';c.dataset.chartKey=key;c.innerHTML=data.map(x=>'<div class="big-chart-row"><div class="big-chart-name">'+x.name+'</div><div class="big-chart-track"><div class="big-chart-fill" style="width:'+Math.max(2,x.count/max*100)+'%"></div></div><div class="big-chart-value">'+x.count+' · '+x.pct.toFixed(1).replace('.',',')+'%</div></div>').join('');src.parentNode.insertBefore(c,src);src.classList.add('roubo-source-hidden');return true}
function process(d){if(!d||!d.body)return;if(!d.getElementById('all-bars-css')){const st=d.createElement('style');st.id='all-bars-css';st.textContent=css;d.head.appendChild(st)}
[['arma utilizada','arma de fogo','roubo-arma'],['local do fato','farmácia','roubo-local'],['meio utilizado / modo de abordagem','a pé','roubo-meio'],['modo de abordagem','a pé','roubo-modo'],['estabelecimento','farmácia são joão','roubo-estabelecimento'],['tipo de roubo (próprio ou impróprio)','próprio','roubo-tipo'],['logradouro','av. praia de belas','roubo-logradouro']].forEach(x=>robberyChart(d,x[0],x[1],x[2]));
orcrim(d,'#p-orcrim-vitima','orcrim-vitima');orcrim(d,'#p-orcrim-autores','orcrim-autores');
// Incidência por CIA permanece removida conforme solicitado.
}
const f=document.getElementById('dash');
function run(){try{if(f.contentDocument)process(f.contentDocument)}catch(e){}}
f.addEventListener('load',()=>{run();setTimeout(run,500);setTimeout(run,1200);setTimeout(run,2500);setTimeout(run,5000);try{const d=f.contentDocument;if(d&&d.body){new MutationObserver(()=>{clearTimeout(window.__allBars);window.__allBars=setTimeout(run,180)}).observe(d.body,{childList:true,subtree:true,characterData:true)}}}catch(e){}});
</script>
</body>
</html>
