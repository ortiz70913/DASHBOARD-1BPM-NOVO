<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard 1º BPM — Gráficos</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="dash" src="index.html" title="Dashboard 1º BPM"></iframe>
<script>
const css=`
.roubo-bar-chart{display:flex!important;flex-direction:column!important;gap:12px!important;width:100%!important;margin:14px 0 18px!important;padding:0!important}
.roubo-bar-row{display:grid!important;grid-template-columns:270px minmax(220px,1fr) 120px!important;gap:14px!important;align-items:center!important;width:100%!important;min-height:42px!important}
.roubo-bar-name{font-size:.86rem!important;font-weight:800!important;color:#10233d!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
.roubo-bar-track{height:27px!important;width:100%!important;background:#e8edf3!important;border:1px solid #cbd6e2!important;border-radius:8px!important;overflow:hidden!important;box-sizing:border-box!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)!important}
.roubo-bar-fill{height:100%!important;border-radius:7px!important;background:linear-gradient(90deg,#8aa9cc 0%,#0b2545 100%)!important}
.roubo-bar-value{font-size:.82rem!important;font-weight:900!important;color:#10233d!important;text-align:right!important;white-space:nowrap!important}
.roubo-source-hidden{display:none!important}
@media(max-width:900px){.roubo-bar-row{grid-template-columns:200px minmax(160px,1fr) 105px!important;gap:9px!important}}
@media(max-width:600px){.roubo-bar-row{grid-template-columns:1fr!important;gap:4px!important}.roubo-bar-name{font-size:.8rem!important}.roubo-bar-value{text-align:left!important;font-size:.75rem!important}.roubo-bar-track{height:23px!important}}
`;
const wanted=[
 'arma utilizada',
 'local do fato',
 'meio utilizado / modo de abordagem',
 'modo de abordagem',
 'estabelecimento',
 'tipo de roubo (próprio ou impróprio)',
 'logradouro'
];
function norm(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase()}
function getPercent(t){const m=String(t||'').match(/(\d+(?:[.,]\d+)?)\s*%/);return m?parseFloat(m[1].replace(',','.')):0}
function getCount(t){
 const text=String(t||'');
 const pm=text.match(/\d+(?:[.,]\d+)?\s*%/);
 const before=pm?text.slice(0,pm.index):text;
 const nums=before.match(/\d+/g)||[];
 if(nums.length>=2)return parseInt(nums[nums.length-1],10)||0;
 return 0;
}
function findSource(panel){return panel.querySelector('.bars')}
function findPanelForHeading(h){
 let node=h.parentElement;
 for(let i=0;i<12&&node;i++,node=node.parentElement){
   const source=findSource(node);
   if(source)return node;
 }
 return null;
}
function isGenericTotalRow(r){
 const text=norm(r.textContent);
 return /^(?:não informado|nao informado)\s+\d+\s*[·•-]\s*\d+(?:[.,]\d+)?\s*%/.test(text);
}
function build(d,h,panel,source){
 if(panel.dataset.rouboDone==='1')return;
 const rows=[...source.querySelectorAll('.bar')];
 if(!rows.length)return;
 const data=rows.map(r=>{
   const b=r.querySelector('b');
   let name=(b?b.textContent:r.textContent).trim();
   name=name.replace(/^\s*\d+\s*[º°.]?\s*/,'').trim();
   return{name,count:getCount(r.textContent),pct:getPercent(r.textContent),raw:norm(r.textContent)};
 }).filter(x=>x.name && x.count>0 && x.pct>0 && !isGenericTotalRow({textContent:x.raw}));
 if(!data.length)return;
 const max=Math.max(1,...data.map(x=>x.count));
 const chart=d.createElement('div');
 chart.className='roubo-bar-chart';
 chart.dataset.rouboChart='1';
 chart.innerHTML=data.map(x=>{
   const width=Math.max(3,(x.count/max)*100);
   return '<div class="roubo-bar-row">'+
     '<div class="roubo-bar-name" title="'+x.name.replace(/"/g,'&quot;')+'">'+x.name+'</div>'+
     '<div class="roubo-bar-track"><div class="roubo-bar-fill" style="width:'+width+'%"></div></div>'+ 
     '<div class="roubo-bar-value">'+x.count+' · '+x.pct.toFixed(1).replace('.',',')+'%</div>'+ 
   '</div>';
 }).join('');
 h.parentNode.insertBefore(chart,h.nextSibling);
 source.classList.add('roubo-source-hidden');
 panel.dataset.rouboDone='1';
}
function process(d){
 if(!d||!d.body||!d.head)return;
 if(!d.getElementById('roubo-bars-css')){
   const st=d.createElement('style');st.id='roubo-bars-css';st.textContent=css;d.head.appendChild(st);
 }
 const heads=[...d.querySelectorAll('h1,h2,h3,h4,.title,.hd')];
 heads.forEach(h=>{
   const title=norm(h.textContent);
   if(!wanted.includes(title))return;
   const panel=findPanelForHeading(h);
   if(!panel)return;
   const source=findSource(panel);
   if(!source)return;
   build(d,h,panel,source);
 });
}
const frame=document.getElementById('dash');
frame.addEventListener('load',()=>{
 const run=()=>{try{process(frame.contentDocument)}catch(e){}};
 run();
 setTimeout(run,500);
 setTimeout(run,1200);
 setTimeout(run,2200);
 setTimeout(run,4000);
 setTimeout(run,7000);
 try{
   const d=frame.contentDocument;
   if(d&&d.body){
     const observer=new MutationObserver(()=>{
       clearTimeout(window.__rouboTimer);
       window.__rouboTimer=setTimeout(run,150);
     });
     observer.observe(d.body,{childList:true,subtree:true});
   }
 }catch(e){}
});
</script>
</body>
</html>
