<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard 1º BPM — Gráficos</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="dash" src="index.html" title="Dashboard 1º BPM"></iframe>
<script>
const css=`
.roubo-bar-chart{display:flex!important;flex-direction:column!important;gap:12px!important;width:100%!important;margin:14px 0!important;padding:0!important}
.roubo-bar-row{display:grid!important;grid-template-columns:220px minmax(220px,1fr) 110px!important;gap:12px!important;align-items:center!important;width:100%!important;min-height:36px!important}
.roubo-bar-name{font-size:.88rem!important;font-weight:800!important;color:#10233d!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.roubo-bar-track{height:24px!important;width:100%!important;background:#e8edf3!important;border:1px solid #ccd6e1!important;border-radius:7px!important;overflow:hidden!important;box-sizing:border-box!important}
.roubo-bar-fill{height:100%!important;border-radius:6px!important;background:linear-gradient(90deg,#8aa9cc,#123457)!important}
.roubo-bar-value{font-size:.84rem!important;font-weight:900!important;color:#10233d!important;text-align:right!important;white-space:nowrap!important}
.roubo-source-hidden{display:none!important}
@media(max-width:900px){.roubo-bar-row{grid-template-columns:170px minmax(140px,1fr) 95px!important;gap:8px!important}}
@media(max-width:600px){.roubo-bar-row{grid-template-columns:1fr!important;gap:4px!important}.roubo-bar-value{text-align:left!important}.roubo-bar-track{height:21px!important}}
`;
const configs=[
 {title:'arma utilizada',anchor:'arma de fogo'},
 {title:'local do fato',anchor:'farmácia'},
 {title:'meio utilizado / modo de abordagem',anchor:'a pé'},
 {title:'modo de abordagem',anchor:'a pé'},
 {title:'estabelecimento',anchor:'farmácia são joão'},
 {title:'tipo de roubo (próprio ou impróprio)',anchor:'próprio'},
 {title:'logradouro',anchor:'av. praia de belas'}
];
function norm(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase()}
function getPercent(t){const m=String(t||'').match(/(\d+(?:[.,]\d+)?)\s*%/);return m?parseFloat(m[1].replace(',','.')):0}
function getCount(t){const text=String(t||'');const pm=text.match(/\d+(?:[.,]\d+)?\s*%/);const before=pm?text.slice(0,pm.index):text;const nums=before.match(/\d+/g)||[];return nums.length>=2?parseInt(nums[nums.length-1],10)||0:0}
function findHeading(doc,title){return [...doc.querySelectorAll('h1,h2,h3,h4,.title,.hd')].find(h=>norm(h.textContent)===title)||null}
function findSource(heading,cfg){let node=heading.parentElement;for(let level=0;level<12&&node;level++,node=node.parentElement){const sources=[...node.querySelectorAll('.bars')];const hit=sources.filter(s=>s.querySelectorAll('.bar').length>=2).find(s=>norm(s.textContent).includes(cfg.anchor));if(hit)return hit}return null}
function buildChart(doc,heading,data,key){if(!data.length)return null;const panel=heading.parentElement;if(panel.querySelector('.roubo-bar-chart[data-roubo-chart="'+key+'"]'))return null;const max=Math.max(...data.map(x=>x.count),1);const chart=doc.createElement('div');chart.className='roubo-bar-chart';chart.dataset.rouboChart=key;chart.innerHTML=data.map(x=>{const w=Math.max(2,x.count/max*100);return '<div class="roubo-bar-row"><div class="roubo-bar-name">'+x.name+'</div><div class="roubo-bar-track"><div class="roubo-bar-fill" style="width:'+w+'%"></div></div><div class="roubo-bar-value">'+x.count+' · '+x.pct.toFixed(1).replace('.',',')+'%</div></div>'}).join('');heading.parentNode.insertBefore(chart,heading.nextSibling);return chart}
function makeChart(doc,heading,source,key){const rows=[...source.querySelectorAll('.bar')];const data=rows.map(r=>{const b=r.querySelector('b');const name=String(b?b.textContent:r.textContent).trim().replace(/^\s*\d+\s*[º°.]?\s*/,'').trim();return{name,count:getCount(r.textContent),pct:getPercent(r.textContent)}}).filter(x=>x.name&&x.count>0&&x.pct>0);const chart=buildChart(doc,heading,data,key);if(chart)source.classList.add('roubo-source-hidden')}

function findCiaHeading(doc){
  return [...doc.querySelectorAll('h1,h2,h3,h4,.title,.hd')].find(e=>norm(e.textContent)==='incidência por companhia')||null;
}

function extractCiaRows(panel){
  const names=['2ª cia','1ª cia','3ª cia'];
  const result=[];
  for(const name of names){
    const candidates=[...panel.querySelectorAll('*')].filter(e=>{
      if(e.closest('.roubo-cia-chart')) return false;
      const t=norm(e.textContent);
      return t.includes(name) && /\d+(?:[.,]\d+)?\s*%/.test(t) && t.length<=220;
    }).sort((a,b)=>a.textContent.length-b.textContent.length);
    if(!candidates.length) continue;
    const e=candidates[0];
    const t=e.textContent.replace(/\s+/g,' ').trim();
    const pm=t.match(/(\d+(?:[.,]\d+)?)\s*%/);
    if(!pm) continue;
    const before=t.slice(0,pm.index);
    const nums=before.match(/\d+/g)||[];
    const count=nums.length?parseInt(nums[nums.length-1],10):0;
    if(count<=0) continue;
    result.push({name:name.toUpperCase(),count,pct:parseFloat(pm[1].replace(',','.')),source:e});
  }
  return result;
}

function hideCiaOriginalRow(source, panel){
  let node=source;
  // Prefer the actual row used by the dashboard.
  const row=source.closest('.ciarow,.bar,.hb');
  if(row && row!==panel) { row.classList.add('roubo-source-hidden'); return; }
  // Otherwise find the smallest ancestor that contains the complete row text.
  for(let i=0;i<6 && node && node!==panel;i++,node=node.parentElement){
    const t=norm(node.textContent);
    if(t.length<=180 && /(?:1ª|2ª|3ª)\s*cia/.test(t) && /\d+(?:[.,]\d+)?\s*%/.test(t)){
      node.classList.add('roubo-source-hidden');
      return;
    }
  }
  source.classList.add('roubo-source-hidden');
}

function makeCiaChart(doc){
  if(doc.querySelector('.roubo-cia-chart')) return;
  const heading=findCiaHeading(doc);
  if(!heading) return;
  let panel=heading.parentElement;
  for(let i=0;i<12 && panel;i++,panel=panel.parentElement){
    const t=norm(panel.textContent);
    if(t.includes('2ª cia')&&t.includes('1ª cia')&&t.includes('3ª cia')) break;
  }
  if(!panel) return;
  const data=extractCiaRows(panel);
  if(data.length!==3) return;
  const max=Math.max(...data.map(x=>x.count),1);
  const chart=doc.createElement('div');
  chart.className='roubo-bar-chart roubo-cia-chart';
  chart.dataset.rouboChart='cia';
  chart.innerHTML=data.map(x=>{const w=Math.max(2,x.count/max*100);return '<div class="roubo-bar-row"><div class="roubo-bar-name">'+x.name+'</div><div class="roubo-bar-track"><div class="roubo-bar-fill" style="width:'+w+'%"></div></div><div class="roubo-bar-value">'+x.count+' · '+x.pct.toFixed(1).replace('.',',')+'%</div></div>'}).join('');
  heading.parentNode.insertBefore(chart,heading.nextSibling);
  data.forEach(x=>hideCiaOriginalRow(x.source,panel));
}

function process(doc){
  if(!doc||!doc.body)return;
  if(!doc.getElementById('roubo-bars-css')){const st=doc.createElement('style');st.id='roubo-bars-css';st.textContent=css;doc.head.appendChild(st)}
  configs.forEach((c,i)=>{const h=findHeading(doc,c.title);if(!h)return;const s=findSource(h,c);if(!s)return;makeChart(doc,h,s,'roubo-'+i)});
  makeCiaChart(doc);
}

const frame=document.getElementById('dash');
frame.addEventListener('load',()=>{
  const run=()=>{try{process(frame.contentDocument)}catch(e){}};
  run();setTimeout(run,800);setTimeout(run,1800);setTimeout(run,3500);
  try{
    const d=frame.contentDocument;
    if(d&&d.body){
      const observer=new MutationObserver(()=>{clearTimeout(window.__rouboTimer);window.__rouboTimer=setTimeout(run,300)});
      observer.observe(d.body,{childList:true,subtree:true});
    }
  }catch(e){}
});
</script>
</body>
</html>
