<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard 1º BPM — Correção de barras</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="dashboard" src="index.html" title="Dashboard 1º BPM"></iframe>
<script>
const cssFix=`
/* CORREÇÃO — barra não pode ficar sobre o dado */
.bar{position:relative!important;margin-bottom:12px!important;}
.bar>b{display:block!important;margin-bottom:5px!important;line-height:1.25!important;}
.bar>div{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:4px!important;position:relative!important;}
.bar>div>i{display:block!important;position:static!important;flex:0 0 auto!important;}
.bar>div>em{display:block!important;position:static!important;transform:none!important;margin:0!important;line-height:1.2!important;text-align:right!important;white-space:nowrap!important;}
.bardelta{display:block!important;position:static!important;margin:3px 0 0 1.8rem!important;}
`;
function applyFix(){
  const f=document.getElementById('dashboard');
  try{
    const d=f.contentDocument;
    if(!d)return;
    if(d.getElementById('barra-fix-css'))return;
    const s=d.createElement('style');s.id='barra-fix-css';s.textContent=cssFix;d.head.appendChild(s);
  }catch(e){console.error('Não foi possível aplicar a correção:',e)}
}
document.getElementById('dashboard').addEventListener('load',()=>{applyFix();setTimeout(applyFix,500);setTimeout(applyFix,1500);});
</script>
</body>
</html>
